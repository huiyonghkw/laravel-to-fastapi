name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest
      - name: Docker build
        run: docker build -t laravel-fastapi-ci .
