# Alembic 最小可跑配置（EP07 · 对照 php artisan migrate）
# 用法（在 fastapi/ 目录）：
#   alembic revision --autogenerate -m "initial"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 演示用内存库时 autogenerate 意义有限；真实项目改成 postgresql+psycopg://...
sqlalchemy.url = sqlite:///./ep07_demo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
